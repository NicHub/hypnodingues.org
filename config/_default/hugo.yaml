locale: fr-CH
title: Hypnodingues
theme: hypnodingues
enableRobotsTXT: true
publishDir: .hugo/public
resourceDir: .hugo/resources

pagination:
  pagerSize: 10000

permalinks:
  posts: /posts/:contentbasename/

taxonomies:
  category: categories

menu:
  main:
    - name: Accueil
      pageRef: /
      weight: 10
    - name: Articles
      pageRef: /posts
      weight: 20

params:
  description: Hypnodingues, archives de textes, d’hypnose, de conscience et de traversées intérieures.
  theme:
    variant: poetic-dark
  home:
    eyebrow: Il etait une fois...
    bgImage: /assets/nuweiba.jpg

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      footnote:
        backlinkHTML: "↩︎"

security:
  allowContent:
    - text/markdown
    - text/html

contentTypes:
  text/html: {}
  text/asciidoc: {}
  text/markdown: {}
  text/org: {}
  text/pandoc: {}
  text/rst: {}
