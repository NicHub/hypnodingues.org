locale: fr-CH
title: Hypnodingues
theme: hypnodingues
enableRobotsTXT: true
publishDir: .hugo_nokdrive/public
resourceDir: .hugo_nokdrive/resources

pagination:
    pagerSize: 10000

frontmatter:
    lastmod: [lastmod, date]

permalinks:
    posts: /posts/:contentbasename/

taxonomies:
    category: categories

menu:
    main:
        - name: Accueil
          pageRef: /
          weight: 10
        - name: Articles
          pageRef: /posts
          weight: 20
        - name: Catégories
          pageRef: /categories/
          weight: 30
        - name: Médias
          pageRef: /medias/
          weight: 40

params:
    posts:
        # Articles récemment modifiés : showRecentlyModified active l’exergue
        # sur /posts/ ; recentlyModifiedCount règle le nombre de vignettes.
        # Ces articles restent également dans la liste complète.
        #
        # Le classement utilise le champ YAML natif lastmod de chaque article,
        # initialisé avec la date de son dernier commit Git lors de la migration.
        # Mettre à jour lastmod manuellement lors des prochaines modifications.
        # Aucun script additionnel n’est nécessaire, en local comme sur GitHub.
        # Si lastmod manque, Hugo émet un warning sans bloquer la compilation
        # et utilise la date de publication (voir frontmatter.lastmod ci-dessus).
        showRecentlyModified: true
        recentlyModifiedCount: 4
    description: Hypnodingues, archives de textes, d’hypnose, de conscience et de traversées intérieures.
    theme:
        variant: poetic-dark
    home:
        eyebrow: Il etait une fois...
        bgImage: /assets/nuweiba.jpg

outputs:
    home:
        - HTML
        - RSS
    section:
        - HTML
        - RSS

markup:
    goldmark:
        renderer:
            unsafe: true
        extensions:
            footnote:
                backlinkHTML: "↩︎"

security:
    allowContent:
        - text/markdown
        - text/html

contentTypes:
    text/html: {}
    text/asciidoc: {}
    text/markdown: {}
    text/org: {}
    text/pandoc: {}
    text/rst: {}
