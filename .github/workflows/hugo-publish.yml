name: Publish Hugo site to GitHub Pages

on:
  push:
    branches: [hugo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.159.0"
          extended: true

      - name: Setup Dart Sass
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official Dart Sass binary
        run: |
          SASS_VERSION="1.93.2"
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o dart-sass.tar.gz
          tar -xzf dart-sass.tar.gz
          mkdir -p "$HOME/.local/lib"
          rm -rf "$HOME/.local/lib/dart-sass"
          mv dart-sass "$HOME/.local/lib/dart-sass"
          echo "$HOME/.local/lib/dart-sass" >> "$GITHUB_PATH"
          "$HOME/.local/lib/dart-sass/sass" --version

      - name: Build
        run: hugo --config hugo.yaml --gc

      - name: Sanity check public
        run: |
          test -d public
          test -f public/index.html
          test -f public/posts/index.html
          test -f public/CNAME
          ls -la public | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
